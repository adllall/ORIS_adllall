
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Rockstar Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background-color: #080808;
            background-image:
                    radial-gradient(circle at 25px 30px, #181818 2px, transparent 3px),
                    radial-gradient(circle at 95px 95px, #171717 3px, transparent 4px),
                    linear-gradient(30deg, transparent 48%, #101010 49%, #101010 51%, transparent 52%);
            background-size: 145px 145px;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 95px 20px 15px;
        }

        .logo {
            position: relative;
            height: 120px;
            margin-bottom: 25px;
            color: white;
        }

        .logo-r {
            font-size: 105px;
            font-weight: 900;
            font-style: italic;
            line-height: 1;
        }

        .logo-star {
            position: absolute;
            font-size: 75px;
            top: 42px;
            left: 49px;
            color: white;
            text-shadow: 2px 2px black;
        }

        .card {
            width: 553px;
            max-width: 100%;
            background: #fff;
            color: #111;
            border-radius: 2px;
            padding: 22px;
        }

        h1 {
            margin: 0 0 22px;
            font-size: 27px;
            color: #4c4c4c;
        }

        .field {
            display: block;
            width: 100%;
            height: 56px;
            margin-bottom: 21px;
            padding: 0 21px;
            border: 1px solid #e1e1e1;
            border-radius: 4px;
            font-size: 18px;
            background: white;
            color: #555;
        }

        .password-box {
            position: relative;
        }

        .password-box .field {
            padding-right: 55px;
        }

        .eye {
            position: absolute;
            right: 24px;
            top: 16px;
            color: #999;
            font-size: 21px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 18px;
            margin-top: 3px;
        }

        .checkbox {
            width: 23px;
            height: 23px;
            border: 1px solid #333;
            border-radius: 3px;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 21px;
        }

        .forgot {
            font-size: 18px;
            color: #222;
            text-decoration: underline;
        }

        .sign-button {
            background: #ffae13;
            border: none;
            border-radius: 3px;
            padding: 11px 26px;
            font-size: 18px;
            font-weight: bold;
            color: black;
            cursor: default;
        }

        .social-card {
            width: 553px;
            max-width: 100%;
            height: 116px;
            background: white;
            color: #555;
            border-radius: 2px;
            margin-top: 22px;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 20px;
        }

        .social-icons {
            display: flex;
            gap: 11px;
        }

        .social {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 34px;
            font-weight: bold;
        }

        .playstation {
            background: #00b4e8;
        }

        .xbox {
            background: #087c09;
        }

        .register {
            margin-top: 32px;
            font-size: 18px;
            text-align: center;
        }

        .register a {
            color: #ffb000;
            text-decoration: underline;
        }

        footer {
            margin-top: auto;
            padding-top: 85px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        footer span {
            color: #ccc;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="logo">
        <div class="logo-r">R</div>
        <div class="logo-star">☆</div>
    </div>

    <div class="card">
        <h1>Sign In</h1>

        <input class="field"
               type="text"
               placeholder="Email"
               readonly>

        <div class="password-box">
            <input class="field"
                   type="text"
                   placeholder="Password"
                   readonly>
            <span class="eye">◉</span>
        </div>

        <div class="remember">
            <div class="checkbox"></div>
            <span>Keep me signed in</span>
        </div>

        <div class="bottom-row">
            <span class="forgot">Forgot your password?</span>
            <button class="sign-button" type="button">Sign in</button>
        </div>
    </div>

    <div class="social-card">
        <span>Sign in using</span>

        <div class="social-icons">
            <div class="social playstation">PS</div>
            <div class="social xbox">X</div>
        </div>
    </div>

    <div class="register">
        Don't have a Rockstar Games account?
        <a>Create a new account</a>
    </div>

    <footer>
        © 2026 ROCKSTAR GAMES |
        <span>PRIVACY POLICY | TERMS OF SERVICE | COOKIE SETTINGS</span>
    </footer>

</div>

</body>
</html>
