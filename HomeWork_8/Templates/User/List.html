<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
            width: 650px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>
<body>

<h1>Список пользователей</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Почта</th>
        <th>Возраст</th>
    </tr>

    $foreach(var user in Users)
    <tr>
        <td>${user.Id}</td>
        <td>${user.Name}</td>
        <td>${user.Email}</td>
        <td>${user.Age}</td>
    </tr>
    $endfor

</table>

</body>
</html>
