<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>

    <style>
        body {
            font-family: Arial;
            background: #eee;
            padding: 40px;
        }

        .profile {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="profile">
    <h1>Профиль пользователя</h1>

    <p>Имя: ${Name}</p>
    <p>Возраст: ${Age}</p>
    <p>Город: ${User.City}</p>

    $if(IsActive)
    <p>Пользователь активен</p>
    $else
    <p>Пользователь неактивен</p>
    $endif

    <h2>Предметы</h2>

    <ul>
        $foreach(var subject in Subjects)
        <li>${subject}</li>
        $endfor
    </ul>

    <a href="/user/list">Список пользователей</a>
</div>

</body>
</html>
