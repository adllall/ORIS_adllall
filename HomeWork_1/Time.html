
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Search Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .clock {
            font-size: 85px;
            font-weight: bold;
            color: #222;
        }

        .greeting {
            font-size: 32px;
            color: #7065ed;
            font-weight: bold;
            margin-top: 20px;
        }

        .city {
            font-size: 20px;
            color: #7065ed;
            margin-top: 15px;
        }

        .search {
            margin-top: 80px;
            width: 400px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="clock" id="clock">00:00:00</div>

    <div class="greeting" id="greeting">
        Good Morning.
    </div>

    <div class="city">Moscow</div>

    <input class="search" type="text" placeholder="Search">

</div>

<script>
    function updateTime() {
        let now = new Date();

        let time = now.toLocaleTimeString("en-GB", {
            timeZone: "Europe/Moscow"
        });

        document.getElementById("clock").innerText = time;

        let hour = parseInt(time.split(":")[0]);
        let greeting = "";

        if (hour < 12) {
            greeting = "Good Morning.";
        } else if (hour < 18) {
            greeting = "Good Afternoon.";
        } else {
            greeting = "Good Evening.";
        }

        document.getElementById("greeting").innerText = greeting;
    }

    updateTime();
    setInterval(updateTime, 1000);
</script>

</body>
</html>
