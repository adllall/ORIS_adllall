<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rockstar — Educational Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 70px 20px 25px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 30px;
        }

        .card {
            width: 550px;
            max-width: 100%;
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 5px;
        }

        h1 {
            margin: 0 0 25px;
        }

        .notice {
            font-size: 13px;
            color: #666;
        }

        .field {
            width: 100%;
            height: 60px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 17px;
        }

        .remember {
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .button {
            background: #ffb51b;
            border: none;
            padding: 14px 28px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #efa400;
        }

        .social {
            width: 550px;
            max-width: 100%;
            background: white;
            color: #333;
            padding: 25px 30px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .icons {
            display: flex;
            gap: 15px;
        }

        .icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .register {
            margin-top: 30px;
            font-size: 14px;
        }

        .register span {
            color: #ffb51b;
        }

        footer {
            margin-top: auto;
            padding-top: 60px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="page">

    <img class="logo"
         src="/connection/Image/logo.png"
         alt="Rockstar">

    <div class="card">

        <h1>Sign In</h1>

        <p class="notice">
            Educational demonstration.
            No real account credentials are collected.
        </p>

        <input class="field"
               type="text"
               value="student123"
               readonly>

        <input class="field"
               type="password"
               value="example456"
               readonly>

        <label class="remember">
            <input type="checkbox">
            Keep me signed in
        </label>

        <div class="actions">

            <span>Forgot your password?</span>

            <button class="button"
                    type="button"
                    onclick="sendDemo()">
                Sign In
            </button>

        </div>

    </div>

    <div class="social">

        <span>Sign in using</span>

        <div class="icons">

            <img class="icon"
                 src="/connection/Image/playstation.png"
                 alt="PlayStation">

            <img class="icon"
                 src="/connection/Image/xbox.png"
                 alt="Xbox">

        </div>

    </div>

    <div class="register">
        Don't have an account?
        <span>Create a new account</span>
    </div>

    <footer>
        EDUCATIONAL DEMONSTRATION
    </footer>

</div>

<script>
    async function sendDemo() {
        try {
            const response = await fetch(
                "/connection/Rockstar/login",
                {
                    method: "POST"
                }
            );

            if (response.ok) {
                alert("Запрос успешно обработан");
            } else {
                alert("Ошибка: " + response.status);
            }
        } catch {
            alert("Ошибка подключения к серверу");
        }
    }
</script>

</body>
</html>
