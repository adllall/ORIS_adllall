
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Учебная форма</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #171717;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 400px;
            max-width: calc(100% - 30px);
            padding: 35px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 26px;
        }

        .notice {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        input {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #ffb51b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #efa400;
        }

        #result {
            margin-top: 15px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Учебная форма</h1>

    <p class="notice">
        Демонстрация HTTP POST-запроса.
        Используйте только вымышленные данные.
        Не вводите пароли от настоящих аккаунтов.
    </p>

    <form id="demoForm">
        <input
                id="login"
                type="text"
                placeholder="Логин"
                autocomplete="off"
                required
        >

        <input
                id="password"
                type="password"
                placeholder="Пароль"
                autocomplete="off"
                required
        >

        <button type="submit">
            Отправить
        </button>
    </form>

    <p id="result"></p>
</div>

<script>
    const form = document.getElementById("demoForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const login = document.getElementById("login").value;
        const password = document.getElementById("password").value;

        result.textContent = "Отправка...";

        try {
            const response = await fetch("/connection/demo", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    login: login,
                    password: password
                })
            });

            if (response.ok) {
                result.textContent = "Данные отправлены";

                form.reset();
            } else {
                result.textContent =
                    "Ошибка сервера: " + response.status;
            }
        } catch (error) {
            console.error("Ошибка соединения");
            result.textContent =
                "Не удалось подключиться к серверу";
        }
    });
</script>

</body>
</html>
